<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fullMdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BF" />
      <stop offset="30%" stop-color="#E8C868" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="90%" stop-color="#B88A28" />
      <stop offset="100%" stop-color="#8C651A" />
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#fullGlow)">
    <!-- Emblem -->
    <g transform="translate(10, 10) scale(0.72)">
      <!-- Right Pillar -->
      <path d="M 76 10 L 88 10 L 88 128 L 76 128 Z" fill="url(#fullMdGold)" />
      <!-- Left Wing -->
      <path d="M 76 10 L 88 10 L 32 46 L 16 36 Z" fill="url(#fullMdGold)" />
      <path d="M 16 36 L 32 46 L 32 94 L 16 84 Z" fill="url(#fullMdGold)" />
      <!-- Beam -->
      <path d="M 16 62 L 88 62 L 88 74 L 16 74 Z" fill="url(#fullMdGold)" />
      <!-- Base Return -->
      <path d="M 16 84 L 32 94 L 76 122 L 68 132 L 16 84 Z" fill="url(#fullMdGold)" />
      <!-- Finials -->
      <polygon points="76,10 88,10 82,3" fill="url(#fullMdGold)" />
      <polygon points="76,128 88,128 82,136" fill="url(#fullMdGold)" />
      <circle cx="52" cy="68" r="4" fill="#FFF8D6" />
    </g>

    <!-- English Typography -->
    <text x="100" y="52" font-family="'Cinzel', 'Cinzel Decorative', 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="4" fill="#FFFFFF">MANAL DHAHI</text>
    <text x="102" y="78" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="url(#fullMdGold)">LEGAL GROUP • KINGDOM OF BAHRAIN</text>
    <text x="102" y="96" font-family="'IBM Plex Sans Arabic', 'Traditional Arabic', sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#E8DFD3">محامون ومستشارون قانونيون • المنامة</text>
  </g>
</svg>
