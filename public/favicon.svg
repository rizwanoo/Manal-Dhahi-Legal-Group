<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CE" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E761E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>
  </defs>

  <!-- High-Contrast Luxury Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#favGold)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Centered Scaled Legal Emblem -->
  <g transform="translate(14, 8) scale(0.36)">
    <!-- Right Judicial Column -->
    <path d="M 64 6 L 76 6 L 76 130 L 64 130 Z" fill="url(#favGold)" />
    
    <!-- Left Wing -->
    <path d="M 64 6 L 76 6 L 24 44 L 8 34 Z" fill="url(#favGold)" />
    <path d="M 8 34 L 24 44 L 24 92 L 8 82 Z" fill="url(#favGold)" />
    
    <!-- Central Beam -->
    <path d="M 8 62 L 76 62 L 76 74 L 8 74 Z" fill="url(#favGold)" />
    
    <!-- Lower Return -->
    <path d="M 8 82 L 24 92 L 64 122 L 56 132 L 8 82 Z" fill="url(#favGold)" />
    
    <!-- Top & Bottom Finials -->
    <polygon points="64,6 76,6 70,0" fill="url(#favGold)" />
    <polygon points="64,130 76,130 70,136" fill="url(#favGold)" />

    <!-- Center Point -->
    <circle cx="44" cy="68" r="4.5" fill="#FFF9DF" />
  </g>
</svg>
