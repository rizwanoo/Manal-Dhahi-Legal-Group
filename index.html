    <!-- Browser Extension Shield -->
    <script>
      window.addEventListener('error', function (e) {
        if (
          (e.filename && (e.filename.includes('chrome-extension://') || e.filename.includes('inpage.js'))) ||
          (e.message && (e.message.includes('MetaMask') || e.message.includes('ethereum')))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('MetaMask') ||
          msg.includes('ethereum') ||
          stack.includes('chrome-extension://') ||
          stack.includes('inpage.js')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
